name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck API
        run: npm run typecheck --workspace @agent-observability/api

      - name: Typecheck web
        run: npm run typecheck --workspace @agent-observability/web

      - name: Build API
        run: npm run build --workspace @agent-observability/api

      - name: Build web
        run: npm run build --workspace @agent-observability/web
