services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
    command: sh -c "npm install && npm run dev --workspace @agent-observability/api"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      SIGNOZ_BASE_URL: http://signoz:3301
      SIGNOZ_API_KEY: ""
    ports:
      - "4000:4000"

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
    command: sh -c "npm install && npm run dev --workspace @agent-observability/web -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "5173:5173"
